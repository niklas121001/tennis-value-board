name: Test scharfe Quoten (einmalig)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python scripts/probe_scharf.py > out.txt 2>&1 || true
          cat out.txt
          python - <<'PY'
          t = open("out.txt").read().replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for i in range(0, len(t), 3000):
              print("::notice title=probe" + str(i // 3000) + "::" + t[i:i+3000])
          PY
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}

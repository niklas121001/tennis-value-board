name: Test scharfe Quoten (einmalig)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/probe_scharf.py
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}

name: API-Test SportsAPIPro

on:
  workflow_dispatch: {}   # nur manuell: Actions → API-Test SportsAPIPro → Run workflow

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: SportsAPIPro testen
        env:
          SPORTSAPIPRO_KEY: ${{ secrets.SPORTSAPIPRO_KEY }}
        run: python scripts/test_sportsapipro.py

name: Daten aktualisieren

on:
  schedule:
    # Läufe um 07:30, 14:05 und 19:30 Uhr deutscher Zeit – ganzjährig (GitHub startet oft 20–40 Min. später). GitHub rechnet in UTC, daher je zwei Zeiten:
    # Sommerzeit (UTC+2): 05:30 und 12:05 UTC · Winterzeit (UTC+1): 06:30 und 13:05 UTC.
    # GitHub verzögert geplante Läufe teils um Stunden oder lässt sie ausfallen. Deshalb gibt es Ersatz-Zeiten,
    # und der Job "zeitpruefung" entscheidet nach deutscher Uhrzeit und docs/data/lauf_status.json:
    # Frühlauf ab 07:15 Uhr, Mittagslauf ab 13:50 Uhr, Abendlauf ab 19:20 Uhr – jeweils einmal pro Tag, egal welcher Zeitplan ihn auslöst.
    - cron: "30 5 * * *"
    - cron: "5 12 * * *"
    - cron: "30 6 * * *"
    - cron: "5 13 * * *"
    - cron: "45 7 * * *"     # Ersatz Frühlauf
    - cron: "15 14 * * *"    # Ersatz Mittagslauf
    - cron: "45 15 * * *"    # Ersatz Mittagslauf
    # Abendlauf 19:30 Uhr deutscher Zeit (Sommer 17:30 UTC, Winter 18:30 UTC), Ersatz 20:15 bzw. 21:00 Uhr
    - cron: "30 17 * * *"
    - cron: "30 18 * * *"
    - cron: "15 19 * * *"    # Ersatz Abendlauf
  workflow_dispatch: {}   # manuell starten: Actions → Daten aktualisieren → Run workflow

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  zeitpruefung:
    runs-on: ubuntu-latest
    outputs:
      laufen: ${{ steps.p.outputs.laufen }}
      slot: ${{ steps.p.outputs.slot }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/data/lauf_status.json
          sparse-checkout-cone-mode: false
      - id: p
        run: |
          hm=$(TZ=Europe/Berlin date +%H%M); heute=$(TZ=Europe/Berlin date +%F)
          if [ "$hm" -ge 1920 ]; then slot=abend; elif [ "$hm" -ge 1350 ]; then slot=mittag; elif [ "$hm" -ge 715 ]; then slot=frueh; else slot=""; fi
          erledigt=$(python3 -c "import json,sys; d=json.load(open('docs/data/lauf_status.json')) if __import__('os').path.exists('docs/data/lauf_status.json') else {}; print(d.get('$slot',''))" 2>/dev/null || true)
          laufen=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -z "$slot" ] || [ "$erledigt" = "$heute" ]; then laufen=false; fi
          fi
          [ -z "$slot" ] && slot=manuell
          echo "Zeitplan '${{ github.event.schedule }}', deutsche Zeit $hm, Lauf '$slot' heute schon: '$erledigt' -> laufen=$laufen"
          echo "laufen=$laufen" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

  update:
    needs: zeitpruefung
    if: needs.zeitpruefung.outputs.laufen == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Ordnerstruktur prüfen
        run: |
          git config user.name "tennis-bot"
          git config user.email "tennis-bot@users.noreply.github.com"
          changed=0
          # Fall 1: Projektordner als Unterordner hochgeladen -> Inhalt nach oben kopieren (ersetzt vorhandene Dateien)
          for d in tennis-value-app tennis-value-board; do
            if [ -d "$d" ]; then
              cp -r "$d"/. . ; git rm -r -q --cached "$d" 2>/dev/null || true; rm -rf "$d"; changed=1
            fi
          done
          # Fall 2: Dateien flach (ohne Ordner) hochgeladen -> in ihre Ordner einsortieren, vorhandene ersetzen
          mv_to () { dir="$1"; shift; mkdir -p "$dir"; for f in "$@"; do if [ -f "$f" ]; then git mv -f "$f" "$dir/$f" 2>/dev/null || mv -f "$f" "$dir/$f"; changed=1; fi; done; true; }
          mv_to docs index.html model.js ergebnisse.html manifest.webmanifest sw.js
          mv_to docs/icons icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png
          mv_to docs/data blacklist.json h2h.json history.json matches.json meta.json name_map.json \
                params.json player_stats.json players.json turniere.json tips_log.json oddspapi.json
          mv_to scripts common.py excel_export.py fetch_odds.py log_tips.js update_elo.py results.py extra_players.py \
                update_calendar.py migrate_history.py sportsapipro.py test_sportsapipro.py serve_stats.py quoten_verlauf.py notify.py
          mv_to tests test_model.js excel_dashboard.json
          # Workflow-Dateien darf der Bot nicht ändern (GitHub-Sperre) -> lose Kopien im Hauptordner nur entfernen;
          # neue Fassungen bitte direkt in .github/workflows/ bearbeiten
          for f in update.yml api-test.yml; do [ -f "$f" ] && git rm -q -f "$f" && changed=1; done; true
          if [ "$changed" = 1 ]; then
            git add -A
            git commit -m "Ordnerstruktur korrigiert"
            git push
          fi
          find . -path ./.git -prune -o -type f -print | sort

      - name: Getrackte Spiele aus dem öffentlichen Ordner entfernen (einmalig)
        continue-on-error: true
        working-directory: scripts
        run: |
          if [ -f migrate_history.py ]; then python migrate_history.py; else echo "migrate_history.py nicht vorhanden – übersprungen"; fi

      - name: Modell-Test (Abgleich mit Excel)
        continue-on-error: true      # warnt nur – blockiert das tägliche Update nicht
        run: node tests/test_model.js

      - name: Turnierkalender mit Belag (Wikipedia)
        continue-on-error: true
        working-directory: scripts
        run: python update_calendar.py

      - name: Elo von Tennis Abstract
        continue-on-error: true
        working-directory: scripts
        run: python update_elo.py

      - name: Spielplan und Quoten von OddsPapi
        if: ${{ env.ODDSPAPI_KEY != '' }}
        working-directory: scripts
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python fetch_odds.py

      - name: Quotenverlauf speichern
        continue-on-error: true
        working-directory: scripts
        run: python quoten_verlauf.py

      - name: Fehlende Spieler schätzen (Challenger)
        continue-on-error: true
        working-directory: scripts
        run: python extra_players.py

      - name: Ergebnisse, Belag und H2H (SportsAPIPro)
        if: ${{ env.SPORTSAPIPRO_KEY != '' }}
        continue-on-error: true
        working-directory: scripts
        run: python sportsapipro.py

      - name: Aufschlag-/Returnwerte fortschreiben
        continue-on-error: true
        working-directory: scripts
        run: python serve_stats.py

      - name: Value-Tipps protokollieren
        run: node scripts/log_tips.js

      - name: Telegram-Nachricht bei neuen Tipps
        continue-on-error: true
        working-directory: scripts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify.py

      - name: Ergebnisse und Schlussquoten nachtragen
        continue-on-error: true
        working-directory: scripts
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python results.py

      - name: Systemcheck (Telegram-Warnung bei Problemen)
        if: always()
        continue-on-error: true
        working-directory: scripts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPORTSAPIPRO_KEY: ${{ secrets.SPORTSAPIPRO_KEY }}
        run: python notify.py --system

      - name: Änderungen speichern
        if: always()
        run: |
          git config user.name "tennis-bot"
          git config user.email "tennis-bot@users.noreply.github.com"
          # Lauf als erledigt merken (Früh-/Mittagslauf je einmal pro Tag)
          python3 -c "import json,os; p='docs/data/lauf_status.json'; d=json.load(open(p)) if os.path.exists(p) else {}; d['${{ needs.zeitpruefung.outputs.slot }}']=os.popen('TZ=Europe/Berlin date +%F').read().strip(); json.dump(d,open(p,'w'))"
          git add -A docs/data
          git diff --cached --quiet || git commit -m "Daten-Update $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Während des Laufs auf der Website gespeicherte Änderungen (z. B. manuelle Spielerwerte) zuerst einholen
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}" || git rebase --abort || true
          git push
    env:
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      SPORTSAPIPRO_KEY: ${{ secrets.SPORTSAPIPRO_KEY }}

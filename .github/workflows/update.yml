name: Daten aktualisieren

on:
  schedule:
    # Zeiten in UTC: 07:15 und 15:15 UTC = 09:15 und 17:15 Uhr deutscher Sommerzeit
    - cron: "15 7 * * *"
    - cron: "15 15 * * *"
  workflow_dispatch: {}   # manuell starten: Actions → Daten aktualisieren → Run workflow

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Ordnerstruktur prüfen
        run: |
          # Falls der Projektordner als Unterordner hochgeladen wurde: Inhalt einmalig nach oben verschieben
          for d in tennis-value-app tennis-value-board; do
            if [ -d "$d/docs" ] && [ ! -d docs ]; then
              echo "Verschiebe Inhalt von $d nach oben"
              git config user.name "tennis-bot"
              git config user.email "tennis-bot@users.noreply.github.com"
              for f in "$d"/* ; do git mv "$f" . ; done
              git rm -r -q --cached "$d" 2>/dev/null || true
              rm -rf "$d"
              git add -A
              git commit -m "Ordnerstruktur korrigiert"
              git push
            fi
          done
          ls -la

      - name: Modell-Test (Abgleich mit Excel)
        run: node tests/test_model.js

      - name: Elo von Tennis Abstract
        continue-on-error: true
        working-directory: scripts
        run: python update_elo.py

      - name: Spielplan und Quoten von OddsPapi
        if: ${{ env.ODDSPAPI_KEY != '' }}
        working-directory: scripts
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
        run: python fetch_odds.py

      - name: Value-Tipps protokollieren
        run: node scripts/log_tips.js

      - name: Änderungen speichern
        run: |
          git config user.name "tennis-bot"
          git config user.email "tennis-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Daten-Update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
    env:
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
